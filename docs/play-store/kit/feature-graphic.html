<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'GS'; font-weight: 400; src: url('google-sans-latin-400-normal.woff2'); }
  @font-face { font-family: 'GS'; font-weight: 500; src: url('google-sans-latin-500-normal.woff2'); }
  @font-face { font-family: 'GS'; font-weight: 700; src: url('google-sans-latin-700-normal.woff2'); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    font-family: 'GS', sans-serif;
    color: #14131a;
    background:
      radial-gradient(520px 380px at 8% 0%, #ffffff 0%, rgba(255,255,255,0) 70%),
      radial-gradient(560px 420px at 92% 110%, #cfe6d8 0%, rgba(207,230,216,0) 70%),
      linear-gradient(135deg, #eef5f0 0%, #e3efe7 55%, #d6e8dc 100%);
    position: relative;
  }
  .copy { position: absolute; left: 64px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .brand img { width: 56px; height: 56px; border-radius: 16px; box-shadow: 0 8px 24px -8px rgba(30, 80, 50, .35), 0 0 0 1px rgba(30, 80, 50, .12); }
  .brand span { font-weight: 500; font-size: 22px; color: #2c4a38; letter-spacing: -0.2px; }
  h1 { font-weight: 700; font-size: 54px; line-height: 1.04; letter-spacing: -1.6px; }
  h1 em { font-style: normal; color: #1f8a5a; }
  p { margin-top: 18px; font-size: 20px; color: #44534a; line-height: 1.35; }

  .stage { position: absolute; right: 26px; top: 0; bottom: 0; width: 470px; }
  .card {
    position: absolute; width: 200px; height: 268px; border-radius: 30px; overflow: hidden;
    background: #fff; border: 5px solid #fff;
    box-shadow: 0 30px 60px -24px rgba(25, 70, 45, .45), 0 6px 18px rgba(25, 70, 45, .08);
  }
  .card img { width: 100%; height: 190px; object-fit: cover; object-position: top; border-radius: 24px 24px 0 0; display: block; }
  .card .t { font-weight: 700; font-size: 17px; padding: 10px 12px 0; }
  .card .bar { margin: 8px 12px 0; height: 24px; border-radius: 12px; background: #eef5f0; position: relative; }
  .card .bar::after { content: ''; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .card.done .bar { background: #1f8a5a; }
  .card.done .bar::after { left: auto; right: 3px; }
  .c1 { left: 6px; top: 128px; transform: rotate(-9deg); }
  .c3 { right: 0; top: 118px; transform: rotate(8deg); }
  .c2 { left: 128px; top: 92px; width: 216px; height: 290px; z-index: 2; }
  .c2 img { height: 206px; }
  .pill {
    position: absolute; z-index: 3; left: 104px; top: 54px;
    background: #fff; border-radius: 999px; padding: 9px 16px 9px 12px;
    display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px;
    box-shadow: 0 12px 30px -12px rgba(25, 70, 45, .4);
  }
  .pill i { width: 22px; height: 22px; border-radius: 50%; background: #fff1ea; display: grid; place-items: center; font-style: normal; font-size: 13px; }
  .check {
    position: absolute; z-index: 3; left: 316px; top: 360px;
    background: #fff; border-radius: 18px; padding: 10px 14px; display: flex; align-items: center; gap: 10px;
    font-weight: 500; font-size: 15px; color: #2c4a38;
    box-shadow: 0 12px 30px -12px rgba(25, 70, 45, .4);
  }
  .check b { width: 26px; height: 26px; border-radius: 50%; background: #1f8a5a; display: grid; place-items: center; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="icon.png" alt="" /><span>Habit Tracker</span></div>
    <h1>Habits that feel<br />like a <em>reward.</em></h1>
    <p>Illustrated habit cards. Slide to complete.<br />Runs, sleep and steps tracked for you.</p>
  </div>
  <div class="stage">
    <div class="card c1"><img src="sleep.webp" alt="" /><div class="t">Sleep 8h</div><div class="bar"></div></div>
    <div class="card c3"><img src="reading.webp" alt="" /><div class="t">Read 20 pages</div><div class="bar"></div></div>
    <div class="card c2 done"><img src="running.webp" alt="" /><div class="t">Morning run</div><div class="bar"></div></div>
    <div class="pill"><i>🔥</i>12 day streak</div>
    <div class="check"><b><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 L10 17.5 L19 7"/></svg></b>5.2 km done</div>
  </div>
</body>
</html>
