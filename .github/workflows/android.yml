name: Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      # Optional secrets — the build works without them.
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (+ AAB when a signing key is configured)
        working-directory: android
        run: |
          # gradle.properties has no trailing newline — start on a fresh line.
          printf '\norg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g\n' >> gradle.properties
          FLAGS=../src/buildFlags.ts
          SIGNING=""
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            SIGNING="-Pandroid.injected.signing.store.file=$RUNNER_TEMP/upload.jks -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD -Pandroid.injected.signing.key.alias=$KEY_ALIAS -Pandroid.injected.signing.key.password=$KEY_PASSWORD"
            # Google Play bundle: 7-day trial, then the lifetime unlock.
            sed -i "s/= 'preview'/= 'live'/" $FLAGS
            echo "Building the Google Play AAB (paywall live)…"
            ./gradlew bundleRelease $SIGNING --no-daemon --stacktrace
            sed -i "s/= 'live'/= 'preview'/" $FLAGS
          fi
          # GitHub test APK: never locks (it can't use Play Billing anyway).
          grep -q "= 'preview'" $FLAGS
          ./gradlew assembleRelease $SIGNING --no-daemon --stacktrace

      - name: Upload Gradle reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: android/build/reports/

      - name: Collect APK / AAB
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "HabitTracker-build-${BUILD_NUMBER}.apk"
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "HabitTracker-build-${BUILD_NUMBER}.aab"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: HabitTracker-build-${{ github.run_number }}
          path: |
            HabitTracker-build-*.apk
            HabitTracker-build-*.aab

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${BUILD_NUMBER}" HabitTracker-build-${BUILD_NUMBER}.* \
            --title "Habit Tracker · build ${BUILD_NUMBER}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --notes "Android test build ${BUILD_NUMBER} from ${GITHUB_SHA::7}. Download the APK below and open it on your phone (allow installs from your browser if asked)."
