<!doctype html>
<html><head><meta charset="utf-8" />
<style>
  @font-face { font-family: 'GS'; font-weight: 700; src: url('google-sans-latin-700-normal.woff2'); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 1024px; overflow: hidden; }
  body { font-family: 'GS', sans-serif; position: relative; background: var(--bg); }
  body[data-p='monthly'] { --bg: linear-gradient(135deg, #eef5f0, #d6e8dc); --pill: #1f8a5a; }
  body[data-p='yearly'] { --bg: linear-gradient(135deg, #e3f0fc, #c4dcf3); --pill: #0567b3; }
  body[data-p='lifetime'] { --bg: linear-gradient(135deg, #fff4dc, #f8dca2); --pill: #b9770e; }
  /* Play crops product icons to a rounded hexagon: keep everything in the middle. */
  .safe { position: absolute; inset: 0; transform: scale(.7); transform-origin: 50% 50%; }
  img { position: absolute; left: -88px; top: -210px; width: 1200px; height: 1200px; }
  .pill { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); background: var(--pill); color: #fff;
    font-weight: 700; font-size: 78px; letter-spacing: 3px; padding: 22px 56px; border-radius: 999px; white-space: nowrap;
    box-shadow: 0 18px 40px -16px rgba(0,0,0,.35); }
</style></head>
<body><div class="safe"><img src="logo-fg.svg" alt="" /><div class="pill" id="p"></div></div>
<script>
  const p = new URLSearchParams(location.search).get('p');
  document.body.dataset.p = p;
  document.getElementById('p').textContent = p.toUpperCase();
</script></body></html>
