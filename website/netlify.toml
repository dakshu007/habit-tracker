# Netlify builds this folder when the site is linked to the GitHub repo
# (base directory: website). Manual `netlify deploy --prod --dir=dist` also works.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# After each production deploy, submit every sitemap URL to IndexNow.
[[plugins]]
  package = "./plugins/indexnow"
