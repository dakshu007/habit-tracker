<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'GS'; font-weight: 400; src: url('google-sans-latin-400-normal.woff2'); }
  @font-face { font-family: 'GS'; font-weight: 700; src: url('google-sans-latin-700-normal.woff2'); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { font-family: 'GS', sans-serif; color: #14131a; position: relative; background: var(--bg); }
  body[data-tone='sage'] { --bg: linear-gradient(170deg, #f4f9f5 0%, #e3efe7 60%, #d3e6da 100%); --accent: #1f8a5a; --sub: #44534a; }
  body[data-tone='sky'] { --bg: linear-gradient(170deg, #f4f9fe 0%, #e3f0fc 60%, #cfe4f8 100%); --accent: #0567b3; --sub: #3f4d5c; }
  body[data-tone='peach'] { --bg: linear-gradient(170deg, #fff8f3 0%, #ffece1 60%, #ffdcc9 100%); --accent: #d4581f; --sub: #5a4a42; }
  body[data-tone='lav'] { --bg: linear-gradient(170deg, #f8f6ff 0%, #ece7fe 60%, #ddd5fc 100%); --accent: #6a55e0; --sub: #4a4660; }
  body[data-tone='night'] { --bg: linear-gradient(170deg, #2a2933 0%, #1f1e27 60%, #17161d 100%); --accent: #8fd3ad; --sub: #b9b7c6; color: #fff; }
  .cap { position: absolute; left: 80px; right: 80px; top: 108px; text-align: center; }
  h1 { font-weight: 700; font-size: 84px; line-height: 1.04; letter-spacing: -2.4px; }
  h1 em { font-style: normal; color: var(--accent); }
  p { margin-top: 22px; font-size: 38px; line-height: 1.3; color: var(--sub); }
  .phone {
    position: absolute; left: 50%; top: 420px; transform: translateX(-50%);
    width: 660px; padding: 18px; border-radius: 76px; background: #16151b;
    box-shadow: 0 60px 120px -40px rgba(20, 40, 30, .55), 0 0 0 3px rgba(255,255,255,.08) inset;
  }
  .phone img { display: block; width: 100%; border-radius: 60px; }
</style>
</head>
<body>
  <div class="cap"><h1 id="t"></h1><p id="s"></p></div>
  <div class="phone"><img id="i" alt="" /></div>
  <script>
    const q = new URLSearchParams(location.search);
    document.body.dataset.tone = q.get('tone') || 'sage';
    // *word* in the title is drawn in the accent colour
    document.getElementById('t').innerHTML = (q.get('title') || '').replace(/\*(.+?)\*/g, '<em>$1</em>').replace(/\|/g, '<br>');
    document.getElementById('s').textContent = q.get('sub') || '';
    document.getElementById('i').src = q.get('img');
  </script>
</body>
</html>
