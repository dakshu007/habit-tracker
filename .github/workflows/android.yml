name: Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Log failing node calls made by Gradle
        run: |
          REAL_NODE="$(command -v node)"
          mkdir -p "$HOME/node-wrap"
          cat > "$HOME/node-wrap/node" <<WRAP
          #!/usr/bin/env bash
          ERR=\$(mktemp)
          "$REAL_NODE" "\$@" 2>"\$ERR"
          CODE=\$?
          cat "\$ERR" >&2
          if [ \$CODE -ne 0 ]; then
            { echo "=== node exit \$CODE in \$PWD"; printf '  arg: %s\\n' "\$@"; cat "\$ERR"; } >> "$HOME/node-failures.log"
          fi
          rm -f "\$ERR"
          exit \$CODE
          WRAP
          chmod +x "$HOME/node-wrap/node"
          echo "$HOME/node-wrap" >> "$GITHUB_PATH"

      - name: Build release APK
        working-directory: android
        run: |
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Show failing node calls
        if: failure()
        run: cat "$HOME/node-failures.log" || echo "no node failures logged"

      - name: Upload Gradle reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: android/build/reports/

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "HabitTracker-build-${BUILD_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: HabitTracker-build-${{ github.run_number }}
          path: HabitTracker-build-*.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${BUILD_NUMBER}" "HabitTracker-build-${BUILD_NUMBER}.apk" \
            --title "Habit Tracker · build ${BUILD_NUMBER}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --notes "Android test build ${BUILD_NUMBER} from ${GITHUB_SHA::7}. Download the APK below and open it on your phone (allow installs from your browser if asked)."
